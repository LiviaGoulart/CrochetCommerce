<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/admin/styles/dashboard.css">

    <title>Dashboard</title>

</head>

<body>

<header>

    <section class="logo-area">

        <button class="logo-button">
            ✂
        </button>

        <section>

            <h1>CrochetCommerce</h1>

            <p>Painel de Vendas</p>

        </section>

    </section>


    <section class="profile-area">

        <button class="notification-button">
            🔔
        </button>

        <section class="profile-info">

            <h2 id="user-name">
                Maria Silva
            </h2>

            <p>
                Crocheteira
            </p>

        </section>

        <button class="profile-button">
            👤
        </button>

    </section>

</header>


<main>

    <aside>

        <button class="new-product-button">
            + Novo Produto
        </button>


        <nav>

            <button class="menu-button  active-menu">
                ◫
                Dashboard
            </button>

            <button class="menu-button">
                ◈
                Meus Produtos
            </button>

            <button class="menu-button">
                ⌲
                Pedidos
            </button>

            <button class="menu-button">
                📊
                Análises
            </button>

            <button class="menu-button" id="perfil">
                <span>⊚</span> Meu Perfil / Ateliê
            </button>

            <button class="menu-button">
                ⚙
                Configurações
            </button>

        </nav>

    </aside>


    <section class="dashboard-content">


        <!-- CARDS -->

        <section class="cards-area">


            <article class="dashboard-card">

                <section class="card-header">

                    <button>
                        $
                    </button>

                    <span class="green-text">
                        +12.5%
                    </span>

                </section>

                <h2>
                    R$ 12.450,00
                </h2>

                <p>
                    Receita Total
                </p>

            </article>


            <article class="dashboard-card">

                <section class="card-header">

                    <button>
                        ⌲
                    </button>

                    <span class="green-text">
                        +8.2%
                    </span>

                </section>

                <h2>
                    152
                </h2>

                <p>
                    Vendas Este Mês
                </p>

            </article>


            <article class="dashboard-card">

                <section class="card-header">

                    <button>
                        ◈
                    </button>

                    <span>
                        4 novos
                    </span>

                </section>

                <h2>
                    24
                </h2>

                <p>
                    Produtos Ativos
                </p>

            </article>


            <article class="dashboard-card">

                <section class="card-header">

                    <button>
                        ↗
                    </button>

                    <span class="green-text">
                        +1.2%
                    </span>

                </section>

                <h2>
                    3.8%
                </h2>

                <p>
                    Taxa de Conversão
                </p>

            </article>

        </section>


        <!-- PRODUTOS -->

        <section class="products-section">


            <section class="products-header">

                <h2>
                    Meus Produtos
                </h2>

                <p>
                    Gerencie seus produtos de crochê
                </p>

            </section>


            <!-- FILTROS -->

            <section class="products-filters">

                <input
                    type="text"
                    placeholder="Buscar produtos..."
                    id="search-product"
                >


                <select id="status-filter">

                    <option>
                        Todos os status
                    </option>

                    <option>
                        Ativo
                    </option>

                    <option>
                        Inativo
                    </option>

                </select>


                <select id="category-filter">

                    <option>
                        Todas categorias
                    </option>

                    <option>
                        Amigurumi
                    </option>

                    <option>
                        Bolsas
                    </option>

                </select>

            </section>


            <!-- PRODUTOS VINDOS DA API -->

            <section
                class="products-list"
                id="products-list"
            >
            </section>


        </section>

    </section>

</main>


<script
    type="module"
    src="assets/admin/scripts/dashboard.js">
</script>

</body>

</html>
